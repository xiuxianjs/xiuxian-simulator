# 新版框架配置。默认保留 /，避免增加现有确认凭据的完整指令长度。
# 如改为 /修仙，可设置 space: true 生成 /修仙 签到；超 80 字符的确认按钮会拒绝发送。
apps:
  xiuxian-game:
    enabled: true
    command:
      prefix: '/'
      space: false
      format:
        enabled: true
        match: '^[/#＃!！]\s*'
        replacement: ''

xiuxian-game:
  # 以下为旧版兼容项；配置 apps.xiuxian-game.command 后以新版规则为准，禁止裸指令。
  # 旧指令前缀，支持多字符（如 '**'）；修改后重启。默认 '/'。
  # 自定义时默认只接受该前缀；消息按钮及全局导航跟随配置。
  # commandPrefix: '/'
  # 不配置前缀时默认允许裸指令；显式配置前缀时默认禁止。
  # 使用框架原生 routeText.allowBare，可独立覆盖：
  # routeText:
  #   allowBare: true
  # 默认开启；仅在当前 QQ 消息内查询该消息玩家。enabled: false 可关闭。
  expose:
    enabled: true
    # 可选：不配置则允许框架识别的插件；空数组拒绝全部调用。
    # allowed_callers: ['你的AI插件实际加载名']
  # 可选：替换“点击加入官方群聊”的链接；未填写或留空时沿用默认官群。
  official_group_url: 'https://qm.qq.com/q/vdFtnG7SEK'
  # 可选：仅控制修仙包收到事件后的行为，普通服/渠道服均适用。
  # 不配置 allow = 默认允许全部；allow: [] = 本包不处理任何事件。
  # deny 优先于 allow；使用框架事件名，不使用 QQ 原始事件名。
  # events:
  #   deny: ['guild.join', 'notice.create:join-request'] # 关闭被邀请入群后的处理和加群申请处理
  #   allow: ['message.create', 'private.message.create', 'interaction.create', 'private.interaction.create'] # 只处理消息和按钮
  backend:
    # 必填：online 统一 API origin，不要附加 /api/v1。
    api_url: 'http://tatian-online.alemonjs.com/channel'
    # 可选：覆盖 api_url，仅填 HTTP(S) origin。
    # api_base_url: 'https://tatian-online.alemonjs.com'
    # 可选：默认 /api。使用渠道网关时可改为 /channel-api。
    # api_base_path: /channel-api
    # 官服填写 ROBOT_AUTH_TOKEN；渠道服填写商户平台签发的 BOT_TOKEN。
    robot_auth_token: ''
    # AppID 自动读取 qq-bot 的框架配置，扫码期间等待配置就绪，无需在本包重复填写。
    # 显式渠道模式
    channel_mode: false
    # 普通服任务与通知使用 Go WORKER_AUTH_TOKEN；渠道商户不要配置运营凭据
    worker_token: ''
    # 单次请求超时（毫秒），默认 10000；战斗请求另有较长等待时间。
    api_timeout_ms: 60000
    # 排查卡顿时设为 true 开启每次 API 耗时日志（含生产环境）；默认关闭，不记录凭证和请求体。
    log_api_timings: false
    # 图片渲染、上传和平台发送耗时；默认只记录 >=1秒的阶段。
    log_transport_timings: false
  # 可选：以下地址和密钥都配置才会上报，AppID 自动取自 QQ 框架配置和当前事件。
  # analytics_api_url: 'https://xiuxian-logap.alemonjs.com'
  # analytics_api_key: ''

  # 每个机器人实例使用自己的持久卷，目录需可写。
  # analytics_queue_dir: data/robot-analytics-outbox
