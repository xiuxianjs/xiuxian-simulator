# 将此配置段合并到运行目录的 alemon.config.yaml。
# 保留已有 login、平台凭证、xiuxian-game.minio 等配置，不要覆盖整份文件。
xiuxian-game:
  backend:
    # 必填：online 统一 API origin，不要附加 /api/v1。
    api_url: 'https://xiuxian-simulator.alemonjs.com'
    # 普通服对应官服 ROBOT_AUTH_TOKEN；
    # 渠道模式填写商户签发的 BOT_TOKEN。
    robot_auth_token: ''
    # 显式渠道模式；每个机器人实例使用自己的 Token 与 QQ AppID。
    # 渠道游戏 origin 必须指向独立渠道服，不能复用上面的正式服示例地址。
    channel_mode: false
    channel_bot_id: ''
    # 普通服任务与通知使用 Go WORKER_AUTH_TOKEN；
    # 渠道商户不要配置运营凭据
    worker_token: ''
    # 单次请求超时（毫秒），默认 10000；战斗请求另有较长等待时间。
    api_timeout_ms: 60000
    # 排查卡顿时开启每次 API 耗时日志；默认仅记录 >=1秒的请求，不记录凭证和请求体。
    log_api_timings: false
    # 图片渲染、上传和平台发送耗时；默认只记录 >=1秒的阶段。
    log_transport_timings: false
  # 可选：两项均配置才会上报；不要使用游戏 API 地址。
  # analytics_api_url: 'https://xiuxian-logap.alemonjs.com'
  # analytics_api_key: ''
