services:
  app:
    build:
      context: .
    image: ${BACKEND_IMAGE:-xiuxian-game-backend:latest}
    restart: unless-stopped
    stop_grace_period: 2m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '${HOST_PORT:-3000}:3000'
